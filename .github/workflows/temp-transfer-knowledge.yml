name: Temporary Knowledge Transfer
on:
  workflow_dispatch:
jobs:
  transfer:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Upload Knowledge Hub
        uses: actions/upload-artifact@v4
        with:
          name: MEDICA_Pharma_Knowledge_Hub_v2.0
          path: E:\البرامج\MEDICA_Pharma_Knowledge_Hub_v2.0_ORGANIZED_FINAL.html
          if-no-files-found: error
          retention-days: 1

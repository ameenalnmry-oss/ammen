name: PharmaLIMS CI

on:
  push:
    branches:
      - main
      - master
      - codex-review

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-publish:
    name: validate-build-publish
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      # ============================================================
      # 2. CHECK BYTE-INTEGRITY IMMEDIATELY AFTER CHECKOUT
      # ============================================================
      - name: Diagnose checked-out source hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " Git environment"
          Write-Host "========================================"

          git --version

          Write-Host ""
          Write-Host "core.autocrlf:"
          git config --get core.autocrlf

          Write-Host ""
          Write-Host "========================================"
          Write-Host " Root .gitattributes"
          Write-Host "========================================"

          if (Test-Path ".gitattributes") {
              Get-Content ".gitattributes"
          }
          else {
              Write-Host "No root .gitattributes file found."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host " .gitignore Git EOL state"
          Write-Host "========================================"

          git ls-files --eol PharmaLIMS/.gitignore

          Write-Host ""
          Write-Host "========================================"
          Write-Host " .gitignore source hash"
          Write-Host "========================================"

          $actual = (
              Get-FileHash `
                  -LiteralPath "PharmaLIMS/.gitignore" `
                  -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $manifestLine = Select-String `
              -Path "PharmaLIMS/SOURCE_MANIFEST_SHA256.txt" `
              -Pattern "\s\.gitignore$"

          if (-not $manifestLine) {
              throw ".gitignore is missing from SOURCE_MANIFEST_SHA256.txt."
          }

          $expected = (
              ($manifestLine.Line -split '\s+')[0]
          ).ToLowerInvariant()

          Write-Host "CHECKOUT_HASH=$actual"
          Write-Host "EXPECTED_HASH=$expected"
          Write-Host "ACTUAL_HASH=$actual"

          if ($actual -ne $expected) {
              throw "CHECKOUT BYTE INTEGRITY FAILURE: .gitignore does not match SOURCE_MANIFEST_SHA256.txt immediately after checkout."
          }

          Write-Host "CHECKOUT BYTE INTEGRITY PASS"

      # ============================================================
      # 3. INSTALL .NET
      # ============================================================
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ============================================================
      # 4. VERIFY CONTROLLED SOURCE BEFORE ANY RESTORE / BUILD
      #
      # IMPORTANT:
      # Do not inspect $LASTEXITCODE here.
      # The PowerShell script itself is authoritative.
      # ============================================================
      - name: Validate controlled source manifest before build
        working-directory: PharmaLIMS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Running controlled source-manifest verification..."

          & ./scripts/Test-SourceManifest.ps1

          if (-not $?) {
              throw "Controlled source manifest verification did not complete successfully."
          }

          Write-Host "Controlled source manifest validation passed."

      # ============================================================
      # 5. AUTHORITATIVE PHARMALIMS RELEASE VALIDATION
      #
      # This script owns source/build/SQL/runtime validation.
      # Do not run a separate restore beforehand because restore can
      # create obj/ artifacts before delivery-package validation.
      # ============================================================
      - name: Unified source build SQL WPF runtime validation
        working-directory: PharmaLIMS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting PharmaLIMS authoritative release validation..."

          & ./scripts/Invoke-ReleaseValidation.ps1 `
              -RunDatabaseIntegration `
              -RunRuntimeSmoke

          if (-not $?) {
              throw "PharmaLIMS release validation did not complete successfully."
          }

          Write-Host "PharmaLIMS release validation passed."

      # ============================================================
      # 6. NUGET VULNERABILITY GATE
      # ============================================================
      - name: Reject vulnerable NuGet packages
        working-directory: PharmaLIMS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking NuGet dependency vulnerabilities..."

          $output = & dotnet list package `
              --vulnerable `
              --include-transitive 2>&1

          $output | ForEach-Object {
              Write-Host $_
          }

          if (-not $?) {
              throw "NuGet vulnerability inspection failed."
          }

          $joined = $output -join "`n"

          if (
              $joined -match "has the following vulnerable packages" -or
              $joined -match "Critical" -or
              $joined -match "High"
          ) {
              throw "Vulnerable NuGet package(s) detected."
          }

          Write-Host "NuGet vulnerability gate passed."

      # ============================================================
      # 7. REJECT ACCIDENTALLY TRACKED BUILD / LOCAL ARTIFACTS
      # ============================================================
      - name: Reject tracked build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tracked = git ls-files

          $prohibited = $tracked | Where-Object {
              $_ -match '(^|/)(bin|obj|\.vs|__pycache__)(/|$)' -or
              $_ -match '\.pyc$'
          }

          if ($prohibited) {
              Write-Host "Tracked prohibited artifacts were detected:"

              $prohibited | ForEach-Object {
                  Write-Host " - $_"
              }

              throw "Repository contains prohibited tracked local/build artifacts."
          }

          Write-Host "No prohibited tracked build artifacts detected."

      # ============================================================
      # 8. VERIFY CONTROLLED MIGRATION MANIFEST STILL EXISTS
      # ============================================================
      - name: Verify migration manifest presence
        working-directory: PharmaLIMS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $manifest = "Database/MigrationManifest.json"

          if (-not (Test-Path $manifest)) {
              throw "Database/MigrationManifest.json is missing."
          }

          Write-Host "Migration manifest present."

          $migrationCount = (
              Get-Content $manifest -Raw |
              ConvertFrom-Json
          ).migrations.Count

          Write-Host "Controlled migration entries: $migrationCount"

          if ($migrationCount -lt 1) {
              throw "Migration manifest contains no migrations."
          }

      # ============================================================
      # 9. SHOW BUILD / SOURCE STATE
      # ============================================================
      - name: Show final repository status
        if: always()
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host " HEAD"
          Write-Host "========================================"

          git log -1 --oneline --decorate

          Write-Host ""
          Write-Host "========================================"
          Write-Host " Git status"
          Write-Host "========================================"

          git status --short

          Write-Host ""
          Write-Host "========================================"
          Write-Host " Branch / ref"
          Write-Host "========================================"

          Write-Host "GITHUB_REF=$env:GITHUB_REF"
          Write-Host "GITHUB_SHA=$env:GITHUB_SHA"
          Write-Host "GITHUB_EVENT_NAME=$env:GITHUB_EVENT_NAME"
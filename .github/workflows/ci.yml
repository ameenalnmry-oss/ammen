name: PharmaLIMS CI

on:
  push:
    branches:
      - main
      - master
      - codex-review

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate-build-publish:
    name: validate-build-publish
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'self-hosted' || 'windows-latest' }}
    timeout-minutes: 50

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          clean: true

      - name: Diagnose checked-out source hashes
        run: |
          $ErrorActionPreference = "Stop"
          git --version
          git config --get core.autocrlf

          if (Test-Path ".gitattributes") {
              Get-Content ".gitattributes"
          }
          else {
              Write-Host "No root .gitattributes file found."
          }

          git ls-files --eol PharmaLIMS/.gitignore

          $actual = (Get-FileHash -LiteralPath "PharmaLIMS/.gitignore" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestLine = Select-String -Path "PharmaLIMS/SOURCE_MANIFEST_SHA256.txt" -Pattern "\s\.gitignore$"

          if (-not $manifestLine) {
              throw ".gitignore is missing from SOURCE_MANIFEST_SHA256.txt."
          }

          $expected = (($manifestLine.Line -split '\s+')[0]).ToLowerInvariant()

          Write-Host "CHECKOUT_HASH=$actual"
          Write-Host "EXPECTED_HASH=$expected"

          if ($actual -ne $expected) {
              throw "CHECKOUT BYTE INTEGRITY FAILURE: .gitignore does not match SOURCE_MANIFEST_SHA256.txt immediately after checkout."
          }

          $v299RehashFiles = @(
              "PharmaLIMS/CultureMediaPreparation.xaml.Part2.cs",
              "PharmaLIMS/CultureMediaPreparation.xaml.cs",
              "PharmaLIMS/EMPlanning.xaml.cs",
              "PharmaLIMS/tests/test_release_controls.py",
              "PharmaLIMS/tests/test_v299_development_admin_and_snapshot_controls.py"
          )
          foreach ($v299File in $v299RehashFiles) {
              $v299Hash = (Get-FileHash -LiteralPath $v299File -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host "V299_REHASH $v299Hash $($v299File.Substring('PharmaLIMS/'.Length))"
          }

          Write-Host "CHECKOUT BYTE INTEGRITY PASS"

      - name: Install .NET 8 SDK
        if: github.event_name != 'workflow_dispatch'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Verify installed .NET 8 SDK on Production runner
        if: github.event_name == 'workflow_dispatch'
        run: |
          $ErrorActionPreference = "Stop"
          $sdks = @(dotnet --list-sdks)
          Write-Host ($sdks -join [Environment]::NewLine)
          if (-not ($sdks | Where-Object { $_ -match '^8\.0\.' })) {
              throw ".NET 8 SDK is required on the controlled self-hosted Production runner."
          }

      - name: Validate controlled source manifest before build
        working-directory: PharmaLIMS
        run: |
          $ErrorActionPreference = "Stop"
          & ./scripts/Test-SourceManifest.ps1
          if (-not $?) {
              throw "Controlled source manifest verification did not complete successfully."
          }

      - name: Verify validator content in runner
        working-directory: PharmaLIMS
        run: |
          $ErrorActionPreference = "Stop"
          git rev-parse HEAD

          Select-String -Path "scripts/validate_project.py" -Pattern "excluded_generated_files|packages.lock.json"

          $validatorHash = (Get-FileHash -LiteralPath "scripts/validate_project.py" -Algorithm SHA256).Hash
          Write-Host "VALIDATOR_SHA256=$validatorHash"

          if (-not (Select-String -Path "scripts/validate_project.py" -Pattern '"packages\.lock\.json"' -Quiet)) {
              throw "CI runner is not using the expected validate_project.py packages.lock.json exclusion."
          }

      - name: Unified source build SQL WPF runtime validation
        working-directory: PharmaLIMS
        env:
          PHARMALIMS_PRODUCTION_SMOKE_CONNECTION_STRING: ${{ secrets.PHARMALIMS_PRODUCTION_SMOKE_CONNECTION_STRING }}
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $smokeConnection = $env:PHARMALIMS_PRODUCTION_SMOKE_CONNECTION_STRING
              if ([string]::IsNullOrWhiteSpace($smokeConnection)) {
                  throw "PHARMALIMS_PRODUCTION_SMOKE_CONNECTION_STRING is required for self-hosted SQL validation."
              }

              $masterConnection = [regex]::Replace(
                  $smokeConnection,
                  '(?i)(^|;)\s*(Database|Initial Catalog)\s*=\s*[^;]*',
                  '$1Database=master'
              )

              if ($masterConnection -eq $smokeConnection -or $masterConnection -notmatch '(?i)(^|;)\s*Database\s*=\s*master(?:;|$)') {
                  throw "Unable to derive the controlled SQL master connection from the Production smoke connection."
              }

              $env:PHARMALIMS_TEST_MASTER_CONNECTION_STRING = $masterConnection
          }

          try {
              & ./scripts/Invoke-ReleaseValidation.ps1 -RunDatabaseIntegration -RunRuntimeSmoke
              if (-not $?) {
                  throw "PharmaLIMS release validation did not complete successfully."
              }
          }
          finally {
              Remove-Item Env:PHARMALIMS_TEST_MASTER_CONNECTION_STRING -ErrorAction SilentlyContinue
          }

      - name: Trend report WPF and complete PDF fixture smoke
        working-directory: PharmaLIMS
        run: |
          $ErrorActionPreference = "Stop"
          dotnet run --project tests/PharmaLIMS.TrendReportSmoke/PharmaLIMS.TrendReportSmoke.csproj --configuration Release -- artifacts/trend-report-preview
          if ($LASTEXITCODE -ne 0) { throw "Trend WPF/PDF fixture smoke failed." }

      - name: Save synthetic trend report previews for visual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trend-report-fixture-preview
          path: PharmaLIMS/artifacts/trend-report-preview/*.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Reject vulnerable NuGet packages
        working-directory: PharmaLIMS
        run: |
          $ErrorActionPreference = "Stop"

          $output = & dotnet list package --vulnerable --include-transitive 2>&1
          $output | ForEach-Object { Write-Host $_ }

          if (-not $?) {
              throw "NuGet vulnerability inspection failed."
          }

          $joined = $output -join "\n"

          if ($joined -match "has the following vulnerable packages" -or $joined -match "Critical" -or $joined -match "High") {
              throw "Vulnerable NuGet package(s) detected."
          }

      - name: Reject tracked build artifacts
        run: |
          $ErrorActionPreference = "Stop"

          $tracked = git ls-files
          $prohibited = $tracked | Where-Object {
              $_ -match '(^|/)(bin|obj|\.vs|__pycache__)(/|$)' -or $_ -match '\.pyc$'
          }

          if ($prohibited) {
              $prohibited | ForEach-Object { Write-Host " - $_" }
              throw "Repository contains prohibited tracked local/build artifacts."
          }

      - name: Verify migration manifest presence
        working-directory: PharmaLIMS
        run: |
          $ErrorActionPreference = "Stop"

          $manifest = "Database/MigrationManifest.json"

          if (-not (Test-Path $manifest)) {
              throw "Database/MigrationManifest.json is missing."
          }

          $migrationCount = (Get-Content $manifest -Raw | ConvertFrom-Json).migrations.Count
          Write-Host "Controlled migration entries: $migrationCount"

          if ($migrationCount -lt 1) {
              throw "Migration manifest contains no migrations."
          }

      - name: Enforce controlled Production release branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          throw "Production release workflow_dispatch is permitted only from refs/heads/main."

      - name: Materialize controlled Production configuration
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: PharmaLIMS
        env:
          PHARMALIMS_PRODUCTION_APPSETTINGS_BASE64: ${{ secrets.PHARMALIMS_PRODUCTION_APPSETTINGS_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:PHARMALIMS_PRODUCTION_APPSETTINGS_BASE64)) {
              throw "Protected secret PHARMALIMS_PRODUCTION_APPSETTINGS_BASE64 is required for controlled Production publish."
          }

          try {
              $bytes = [Convert]::FromBase64String($env:PHARMALIMS_PRODUCTION_APPSETTINGS_BASE64)
              [IO.File]::WriteAllBytes((Join-Path $PWD 'appsettings.Production.json'), $bytes)
          }
          catch {
              throw "Protected production configuration could not be materialized from the Base64 secret."
          }

      - name: Validate controlled Production configuration
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: PharmaLIMS
        run: |
          python -B scripts/validate_project.py --production-publish
          if ($LASTEXITCODE -ne 0) { throw "Production configuration validation failed with native exit code $LASTEXITCODE." }

      - name: Publish self-contained Windows package
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: PharmaLIMS
        run: dotnet publish PharmaLIMS.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish -p:DeploymentEnvironment=Production

      - name: Authenticode-sign published first-party binaries
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: PharmaLIMS
        env:
          PHARMALIMS_CODESIGN_PFX_BASE64: ${{ secrets.PHARMALIMS_CODESIGN_PFX_BASE64 }}
          PHARMALIMS_CODESIGN_PFX_PASSWORD: ${{ secrets.PHARMALIMS_CODESIGN_PFX_PASSWORD }}
          PHARMALIMS_TIMESTAMP_URL: ${{ secrets.PHARMALIMS_TIMESTAMP_URL }}
        run: ./scripts/Sign-PublishedArtifact.ps1 -PublishDirectory ./artifacts/publish

      - name: Smoke exact signed Production artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: PharmaLIMS
        env:
          PHARMALIMS_PRODUCTION_SMOKE_CONNECTION_STRING: ${{ secrets.PHARMALIMS_PRODUCTION_SMOKE_CONNECTION_STRING }}
        run: ./scripts/Invoke-ProductionArtifactSmoke.ps1 -AppPath ./artifacts/publish/PharmaLIMS.exe

      - name: Remove site-specific Production configuration from distributable package
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: PharmaLIMS
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -LiteralPath ./artifacts/publish/appsettings.json -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath ./artifacts/publish/appsettings.json) {
              throw "Site-specific appsettings.json must not be included in the uploaded Production package."
          }

      - name: Generate and verify publish hash manifest and provenance
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: PharmaLIMS
        run: |
          ./scripts/New-PublishManifest.ps1 -PublishDirectory ./artifacts/publish
          ./scripts/Test-PublishManifest.ps1 -PublishDirectory ./artifacts/publish

      - name: Generate resolved CycloneDX SBOM from current restore graph
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: PharmaLIMS
        run: ./scripts/New-ResolvedSbom.ps1 -Project ./PharmaLIMS.csproj -PublishDirectory ./artifacts/publish -OutputPath ./artifacts/publish/SBOM.cdx.json

      - name: Rebuild publish manifest including SBOM
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: PharmaLIMS
        run: |
          ./scripts/New-PublishManifest.ps1 -PublishDirectory ./artifacts/publish
          ./scripts/Test-PublishManifest.ps1 -PublishDirectory ./artifacts/publish

      - name: Stage smoke-tested Production package for hosted attestation
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PharmaLIMS-Production-Staging-${{ github.sha }}
          path: PharmaLIMS/artifacts/publish/**
          if-no-files-found: error
          retention-days: 1

      - name: Remove transient Production configuration
        if: always() && github.event_name == 'workflow_dispatch'
        working-directory: PharmaLIMS
        run: Remove-Item -LiteralPath appsettings.Production.json -Force -ErrorAction SilentlyContinue

      - name: Show final repository status
        if: always()
        run: |
          git log -1 --oneline --decorate
          git status --short
          Write-Host "GITHUB_REF=$env:GITHUB_REF"
          Write-Host "GITHUB_SHA=$env:GITHUB_SHA"
          Write-Host "GITHUB_EVENT_NAME=$env:GITHUB_EVENT_NAME"

  attest-and-upload-production:
    name: attest-and-upload-production
    needs: validate-build-publish
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download smoke-tested Production package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PharmaLIMS-Production-Staging-${{ github.sha }}
          path: PharmaLIMS/artifacts/publish

      - name: Verify staged publish manifest before attestation
        working-directory: PharmaLIMS
        run: ./scripts/Test-PublishManifest.ps1 -PublishDirectory ./artifacts/publish

      - name: Attest publish manifest provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: PharmaLIMS/artifacts/publish/PUBLISH_MANIFEST_SHA256.txt

      - name: Upload signed, smoke-tested package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PharmaLIMS-Production-${{ github.sha }}
          path: PharmaLIMS/artifacts/publish/**
          if-no-files-found: error

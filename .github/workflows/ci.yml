name: PharmaLIMS CI

on:
  push:
    branches:
      - main
      - master
      - codex-review
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-publish:
    name: validate-build-publish
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      # ------------------------------------------------------------
      # 1. Checkout exact repository content
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      # ------------------------------------------------------------
      # 2. Diagnose byte-exact checkout before any restore/build
      # ------------------------------------------------------------
      - name: Diagnose checked-out source hashes
        run: |
          Write-Host "=== Git environment ==="
          git --version

          Write-Host "core.autocrlf:"
          git config --get core.autocrlf

          Write-Host ""
          Write-Host "=== .gitattributes ==="
          if (Test-Path ".gitattributes") {
              Get-Content ".gitattributes"
          }
          else {
              Write-Host "NO ROOT .gitattributes FOUND"
          }

          Write-Host ""
          Write-Host "=== .gitignore EOL state ==="
          git ls-files --eol PharmaLIMS/.gitignore

          Write-Host ""
          Write-Host "=== Actual checkout SHA-256 ==="
          $actual = (Get-FileHash `
              "PharmaLIMS/.gitignore" `
              -Algorithm SHA256).Hash.ToLowerInvariant()

          Write-Host "CHECKOUT_HASH=$actual"

          Write-Host ""
          Write-Host "=== Manifest entry ==="
          $manifestLine = Select-String `
              -Path "PharmaLIMS/SOURCE_MANIFEST_SHA256.txt" `
              -Pattern "\.gitignore$"

          $manifestLine.Line

          if (-not $manifestLine) {
              throw ".gitignore was not found in SOURCE_MANIFEST_SHA256.txt"
          }

          $expected = ($manifestLine.Line -split '\s+')[0].ToLowerInvariant()

          Write-Host "EXPECTED_HASH=$expected"
          Write-Host "ACTUAL_HASH=$actual"

          if ($actual -ne $expected) {
              throw "CHECKOUT BYTE INTEGRITY FAILURE: .gitignore does not match SOURCE_MANIFEST_SHA256.txt immediately after checkout."
          }

          Write-Host "CHECKOUT BYTE INTEGRITY PASS"

      # ------------------------------------------------------------
      # 3. Install required .NET SDK
      # ------------------------------------------------------------
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ------------------------------------------------------------
      # 4. Confirm controlled source is pristine BEFORE restore/build
      # ------------------------------------------------------------
      - name: Validate controlled source manifest before build
        working-directory: PharmaLIMS
        run: |
          ./scripts/Test-SourceManifest.ps1

          if ($LASTEXITCODE -ne 0) {
              throw "Controlled source manifest validation failed before restore/build."
          }

      # ------------------------------------------------------------
      # 5. Run the project's authoritative validation pipeline
      #
      # IMPORTANT:
      # We deliberately do NOT perform a separate dotnet restore
      # before this step. That previously created obj/ files before
      # delivery/source validation and caused prohibited-artifact
      # failures.
      # ------------------------------------------------------------
      - name: Unified source build SQL WPF runtime validation
        working-directory: PharmaLIMS
        run: |
          ./scripts/Invoke-ReleaseValidation.ps1 `
            -RunDatabaseIntegration `
            -RunRuntimeSmoke

          if ($LASTEXITCODE -ne 0) {
              throw "Release validation failed with native exit code $LASTEXITCODE."
          }

      # ------------------------------------------------------------
      # 6. NuGet vulnerability gate
      # ------------------------------------------------------------
      - name: Reject vulnerable NuGet packages
        working-directory: PharmaLIMS
        run: |
          $output = dotnet list package --vulnerable --include-transitive

          $output | ForEach-Object {
              Write-Host $_
          }

          if ($LASTEXITCODE -ne 0) {
              throw "NuGet vulnerability inspection failed."
          }

          $joined = $output -join "`n"

          if (
              $joined -match "has the following vulnerable packages" -or
              $joined -match "Critical" -or
              $joined -match "High"
          ) {
              throw "Vulnerable NuGet package(s) detected."
          }

      # ------------------------------------------------------------
      # 7. Reject accidental build/local artifacts in Git state
      # ------------------------------------------------------------
      - name: Reject tracked build artifacts
        run: |
          $tracked = git ls-files

          $prohibited = $tracked | Where-Object {
              $_ -match '(^|/)(bin|obj|\.vs|__pycache__)(/|$)' -or
              $_ -match '\.pyc$'
          }

          if ($prohibited) {
              Write-Host "Tracked prohibited artifacts:"
              $prohibited | ForEach-Object {
                  Write-Host $_
              }

              throw "Repository contains tracked local/build artifacts."
          }

          Write-Host "No prohibited tracked build artifacts detected."

      # ------------------------------------------------------------
      # 8. Final Git cleanliness evidence
      # ------------------------------------------------------------
      - name: Show final repository status
        if: always()
        run: |
          Write-Host "=== HEAD ==="
          git log -1 --oneline --decorate

          Write-Host ""
          Write-Host "=== Git status ==="
          git status --short
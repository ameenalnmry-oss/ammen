name: PharmaLIMS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate-build-publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x


      - name: Materialize and enforce NuGet lock graph
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath ./packages.lock.json)) {
            Write-Warning "Source-only delivery has no generated lock. Materializing it with the pinned CI SDK before the locked restore."
            dotnet restore ./PharmaLIMS.csproj --use-lock-file --force-evaluate
            if ($LASTEXITCODE -ne 0) { throw "NuGet lock generation failed." }
          }
          if (-not (Test-Path -LiteralPath ./packages.lock.json)) {
            throw "packages.lock.json is required and could not be generated by the pinned CI SDK."
          }
          dotnet restore ./PharmaLIMS.csproj --locked-mode

      - name: Unified source / build / SQL / WPF runtime validation
        shell: pwsh
        run: ./scripts/Invoke-ReleaseValidation.ps1 -RunDatabaseIntegration -RunRuntimeSmoke

      - name: Reject vulnerable NuGet packages
        shell: pwsh
        run: |
          $report = dotnet list PharmaLIMS.csproj package --vulnerable --include-transitive --format json |
            ConvertFrom-Json
          $vulnerable = @(
            foreach ($project in $report.projects) {
              foreach ($framework in $project.frameworks) {
                foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                  if (@($package.vulnerabilities).Count -gt 0) {
                    [pscustomobject]@{
                      Framework = $framework.framework
                      Package = $package.id
                      Version = $package.resolvedVersion
                      Vulnerabilities = @($package.vulnerabilities).Count
                    }
                  }
                }
              }
            }
          )
          if ($vulnerable.Count -gt 0) {
            $vulnerable | Format-Table -AutoSize | Out-String | Write-Error
            throw "Vulnerable NuGet package(s) detected."
          }
          Write-Host "No vulnerable NuGet packages were reported."

      - name: Reject obvious hard-coded secrets
        shell: pwsh
        run: |
          $extensions = @('.cs', '.xaml', '.json', '.yml', '.yaml', '.ps1', '.sql')
          $excludedDirectories = @('.git', '.vs', 'bin', 'obj', 'artifacts')
          $secretPattern = '(?i)(password|passwd|pwd|api[_-]?key|client[_-]?secret|access[_-]?token)\s*["'']?\s*[:=]\s*["''][^"'']{8,}["'']'
          $findings = @()
          Get-ChildItem -Path . -File -Recurse |
            Where-Object {
              $extensions -contains $_.Extension.ToLowerInvariant() -and
              -not ($_.FullName.Split([IO.Path]::DirectorySeparatorChar) |
                Where-Object { $excludedDirectories -contains $_ })
            } |
            ForEach-Object {
              $matches = Select-String -LiteralPath $_.FullName -Pattern $secretPattern -AllMatches
              foreach ($match in $matches) {
                $findings += "$($_.FullName):$($match.LineNumber)"
              }
            }
          if ($findings.Count -gt 0) {
            $findings | ForEach-Object { Write-Error "Possible hard-coded secret: $_" }
            throw "Possible hard-coded secret(s) detected."
          }
          Write-Host "No obvious hard-coded secrets were detected."

      - name: Materialize controlled production configuration
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          PHARMALIMS_PRODUCTION_APPSETTINGS_BASE64: ${{ secrets.PHARMALIMS_PRODUCTION_APPSETTINGS_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PHARMALIMS_PRODUCTION_APPSETTINGS_BASE64)) {
            throw "Protected secret PHARMALIMS_PRODUCTION_APPSETTINGS_BASE64 is required for controlled Production publish."
          }
          try {
            $bytes = [Convert]::FromBase64String($env:PHARMALIMS_PRODUCTION_APPSETTINGS_BASE64)
            [IO.File]::WriteAllBytes((Join-Path $PWD 'appsettings.Production.json'), $bytes)
          }
          catch {
            throw "Protected production configuration could not be materialized from the Base64 secret."
          }

      - name: Validate controlled production configuration
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./scripts/Invoke-ReleaseValidation.ps1 -SkipBuild -ValidateProductionConfig

      - name: Publish self-contained Windows package
        if: github.event_name != 'pull_request'
        run: dotnet publish PharmaLIMS.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/publish -p:DeploymentEnvironment=Production

      - name: Authenticode-sign published first-party binaries
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          PHARMALIMS_CODESIGN_PFX_BASE64: ${{ secrets.PHARMALIMS_CODESIGN_PFX_BASE64 }}
          PHARMALIMS_CODESIGN_PFX_PASSWORD: ${{ secrets.PHARMALIMS_CODESIGN_PFX_PASSWORD }}
          PHARMALIMS_TIMESTAMP_URL: ${{ secrets.PHARMALIMS_TIMESTAMP_URL }}
        run: ./scripts/Sign-PublishedArtifact.ps1 -PublishDirectory ./artifacts/publish

      - name: Smoke exact signed Production artifact
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          PHARMALIMS_PRODUCTION_SMOKE_CONNECTION_STRING: ${{ secrets.PHARMALIMS_PRODUCTION_SMOKE_CONNECTION_STRING }}
        run: ./scripts/Invoke-ProductionArtifactSmoke.ps1 -AppPath ./artifacts/publish/PharmaLIMS.exe

      - name: Generate and verify publish hash manifest and provenance
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          ./scripts/New-PublishManifest.ps1 -PublishDirectory ./artifacts/publish
          ./scripts/Test-PublishManifest.ps1 -PublishDirectory ./artifacts/publish

      - name: Generate resolved CycloneDX SBOM from current restore graph
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./scripts/New-ResolvedSbom.ps1 -Project ./PharmaLIMS.csproj -PublishDirectory ./artifacts/publish -OutputPath ./artifacts/publish/SBOM.cdx.json

      - name: Rebuild publish manifest including SBOM
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          ./scripts/New-PublishManifest.ps1 -PublishDirectory ./artifacts/publish
          ./scripts/Test-PublishManifest.ps1 -PublishDirectory ./artifacts/publish

      - name: Attest publish manifest provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: artifacts/publish/PUBLISH_MANIFEST_SHA256.txt

      - name: Remove transient production configuration
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: Remove-Item -LiteralPath appsettings.Production.json -Force -ErrorAction SilentlyContinue

      - name: Upload signed, smoke-tested package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PharmaLIMS-Production-${{ github.sha }}
          path: artifacts/publish/**
          if-no-files-found: error
